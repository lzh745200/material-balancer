appId: com.materialbalancer.app
productName: 物资均衡分配工具
copyright: Copyright © 2026 Material Balancer

directories:
  output: dist
  buildResources: build

# 打包后给 chrome-sandbox 补 SUID 位（4755），麒麟 V10 等系统必需
afterPack: build/afterPack.cjs

# electron-vite 构建产物（主进程已把纯 JS 依赖打包进 out，无需携带 node_modules）
files:
  - out/**

asar: true

# 内置中文字体放到 asar 外，供 PDF 打印模板以 file:// 绝对路径加载
extraResources:
  - from: resources/fonts
    to: fonts
    filter:
      - '**/*'

win:
  icon: build/icon.ico
  artifactName: ${name}-${version}-win64-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 物资均衡分配工具
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: ${name}-${version}-win64-setup.${ext}

portable:
  artifactName: ${name}-${version}-win64-portable.${ext}

linux:
  icon: build/icon.png
  category: Utility
  maintainer: material-balancer
  # 可执行文件用 ASCII 名，避免老旧发行版非 UTF-8 locale 下的路径怪问题；
  # 桌面快捷方式仍显示中文 productName
  executableName: material-balancer
  artifactName: ${name}-${version}-linux-${arch}.${ext}
  target:
    - target: deb
      arch:
        - arm64
    - target: tar.gz
      arch:
        - arm64

deb:
  artifactName: ${name}-${version}-linux-arm64.${ext}
  # 安装后确保 chrome-sandbox 为 root 所有且 4755（dpkg 解包可能不带 SUID）
  afterInstall: build/kylin-after-install.sh
