name: 构建安装包

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows x64（安装版 + 便携版）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build

      - name: 打包 Windows 安装包
        run: npx electron-builder --win --x64 --publish never

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.exe
          if-no-files-found: error

  build-linux-arm64:
    name: Linux ARM64（deb + tar.gz，适配麒麟 V10）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build

      # x64 交叉打包 arm64：electron-builder 会下载 arm64 版 Electron 二进制，无需 ARM 机器
      - name: 打包 Linux ARM64（deb + tar.gz）
        run: npx electron-builder --linux --publish never

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 GitHub Release 并附加安装包
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
