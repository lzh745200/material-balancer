name: 构建安装包

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 同一分支的快速连续推送只保留最新一次完整构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 质量门禁（lint + typecheck + 单元测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 发布前校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG 与 package.json 版本 $PKG 不一致"
            exit 1
          fi

  build-windows:
    name: Windows x64（安装版 + 便携版）
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 缓存 Electron 二进制
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 打包 Windows 安装包
        run: npx electron-builder --win --x64 --publish never

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

  build-linux-arm64:
    name: Linux ARM64（deb + tar.gz，适配麒麟 V10）
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 缓存 Electron 二进制
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      # x64 交叉打包 arm64：electron-builder 会下载 arm64 版 Electron 二进制，无需 ARM 机器
      - name: 打包 Linux ARM64（deb + tar.gz）
        run: npx electron-builder --linux --publish never

      # 麒麟 V10 启动失败回归防线：产物内 chrome-sandbox 必须带 SUID 位（4755），
      # 同时打印 deb 控制信息便于远程排查系统安装器兼容问题
      - name: 校验 chrome-sandbox SUID 位
        run: |
          LISTING=$(tar tvzf dist/*.tar.gz | grep -E 'chrome-sandbox|install\.sh')
          echo "$LISTING"
          # SUID 在权限串中显示为用户位的 s（-rwsr-xr-x）
          echo "$LISTING" | grep 'chrome-sandbox' | grep -q 'rws'
          echo "$LISTING" | grep -q 'install.sh'
          DEB=$(ls dist/*.deb)
          dpkg-deb -I "$DEB" | sed -n '1,30p'
          sudo dpkg-deb -x "$DEB" /tmp/debroot
          MODE=$(stat -c '%a' /tmp/debroot/opt/*/chrome-sandbox)
          echo "deb chrome-sandbox mode: $MODE"
          test "$MODE" = "4755"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 GitHub Release 并附加安装包
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
